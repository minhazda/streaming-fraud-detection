name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src tests
      - run: black --check src tests
      - run: mypy src
      - run: pytest -m "not integration" --cov=streaming_fraud --cov-report=term

  integration:
    name: End-to-end stream test (Redpanda)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Start Redpanda
        run: docker compose up -d redpanda --wait
      - name: Run integration suite
        env:
          SF_BOOTSTRAP_SERVERS: localhost:19092
        run: pytest -m integration -s
      - name: Broker logs on failure
        if: failure()
        run: docker compose logs redpanda

  k8s-smoke:
    name: Kubernetes smoke test (kind)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t streaming-fraud:ci .
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: smoke
      - name: Load image into kind
        run: kind load docker-image streaming-fraud:ci --name smoke
      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deploy/redpanda --timeout=180s
          kubectl rollout status deploy/pipeline --timeout=300s
          kubectl wait --for=condition=complete job/producer --timeout=180s
      - name: Assert the stream was scored
        run: |
          kubectl port-forward svc/pipeline-metrics 8001:8001 &
          sleep 5
          for i in $(seq 1 24); do
            scored=$(curl -s localhost:8001/metrics \
              | awk '/^sf_transactions_total{outcome="scored"}/ {print int($2)}')
            invalid=$(curl -s localhost:8001/metrics \
              | awk '/^sf_transactions_total{outcome="invalid"}/ {print int($2)}')
            echo "poll $i: scored=${scored:-0} invalid=${invalid:-0}"
            if [ "${scored:-0}" -eq 500 ] && [ "${invalid:-0}" -eq 5 ]; then
              echo "stream fully scored"; exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for scored=500 invalid=5"; exit 1
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/pipeline
          kubectl logs deploy/pipeline --all-containers --tail=100 || true
          kubectl logs deploy/redpanda --tail=50 || true
